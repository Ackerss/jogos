name: Deploy ACKER Games to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jogo-corrida/package-lock.json'

      - name: Install dependencies, check types and build Corrida
        run: |
          cd jogo-corrida
          npm ci
          npm run check
          npm run build
          npm test
          cd ..

      - name: Check and test Noite dos Lobos
        run: |
          cd jogo-lobisomem
          npm run check
          npm test
          cd ..

      - name: Assemble site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp portal.css _site/portal.css
          cp site.webmanifest _site/site.webmanifest
          cp *.png _site/ 2>/dev/null || true
          cp *.ico _site/ 2>/dev/null || true
          mkdir -p _site/corrida
          cp -r jogo-corrida/dist/* _site/corrida/
          mkdir -p _site/lobisomem
          cp -r jogo-lobisomem/index.html jogo-lobisomem/css jogo-lobisomem/js jogo-lobisomem/arte _site/lobisomem/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
