name: Deploy ACKER Games to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'jogo-corrida/package-lock.json'

      - name: Install dependencies, check types and build Corrida
        run: |
          cd jogo-corrida
          npm ci
          npm run check
          npm run build
          npm test
          cd ..

      - name: Check and test Noite dos Lobos
        run: |
          cd jogo-lobisomem
          npm run check
          npm test
          cd ..

      - name: Check and test Grande Prêmio dos Bichos
        run: |
          cd jogo-bichos
          npm run check
          npm test
          cd ..

      - name: Check and test Arena Escorregadia
        run: |
          cd jogo-arena
          npm run check
          npm test
          cd ..

      - name: Check and test Ponte do Desespero
        run: |
          cd jogo-ponte
          npm run check
          npm test
          cd ..

      - name: Check and test O Impostor
        run: |
          cd jogo-impostor
          npm run check
          npm test
          cd ..

      - name: Check and test Mentira Convincente
        run: |
          cd jogo-mentira
          npm run check
          npm test
          cd ..

      - name: Check and test Rabisco sem Fio
        run: |
          cd jogo-rabisco
          npm run check
          npm test
          cd ..

      - name: Check and test Dino Pula-Pula
        run: |
          cd jogo-dino
          npm run check
          npm test
          cd ..

      - name: Assemble site directory
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp portal.css _site/portal.css
          cp site.webmanifest _site/site.webmanifest
          cp *.png _site/ 2>/dev/null || true
          cp *.ico _site/ 2>/dev/null || true
          mkdir -p _site/corrida
          cp -r jogo-corrida/dist/* _site/corrida/
          mkdir -p _site/lobisomem
          cp -r jogo-lobisomem/index.html jogo-lobisomem/css jogo-lobisomem/js jogo-lobisomem/arte jogo-lobisomem/audio _site/lobisomem/
          mkdir -p _site/bichos
          cp -r jogo-bichos/index.html jogo-bichos/css jogo-bichos/js jogo-bichos/arte jogo-bichos/audio _site/bichos/
          mkdir -p _site/arena
          cp -r jogo-arena/index.html jogo-arena/css jogo-arena/js jogo-arena/arte _site/arena/
          mkdir -p _site/ponte
          cp -r jogo-ponte/index.html jogo-ponte/css jogo-ponte/js jogo-ponte/arte _site/ponte/
          mkdir -p _site/impostor
          cp -r jogo-impostor/index.html jogo-impostor/css jogo-impostor/js jogo-impostor/arte jogo-impostor/audio _site/impostor/
          mkdir -p _site/mentira
          cp -r jogo-mentira/index.html jogo-mentira/css jogo-mentira/js jogo-mentira/arte _site/mentira/
          mkdir -p _site/rabisco
          cp -r jogo-rabisco/index.html jogo-rabisco/css jogo-rabisco/js jogo-rabisco/arte _site/rabisco/
          mkdir -p _site/dino
          cp -r jogo-dino/index.html jogo-dino/css jogo-dino/js jogo-dino/arte _site/dino/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
